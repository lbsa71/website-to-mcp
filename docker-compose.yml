services:
  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - rag-network
    restart: unless-stopped

  # Ingestion service (run once to populate DB)
  ingest:
    build: .
    container_name: rag-ingest
    command: python app/ingest.py
    environment:
      - CONFIG_PATH=/app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml
    networks:
      - rag-network
    depends_on:
      - qdrant
    profiles:
      - ingest

  # MCP server service
  mcp-server:
    build: .
    container_name: rag-mcp-server
    command: python -m app.mcp_server
    stdin_open: true
    tty: true
    environment:
      - CONFIG_PATH=/app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml
    networks:
      - rag-network
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_storage:

networks:
  rag-network:
    driver: bridge
