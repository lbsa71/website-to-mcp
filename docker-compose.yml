version: '3.8'

services:
  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - rag-network
    restart: unless-stopped

  # Ingestion service (run once to populate DB)
  ingest:
    build: .
    container_name: rag-ingest
    command: python app/ingest.py
    environment:
      - CONFIG_PATH=/app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml
    networks:
      - rag-network
    depends_on:
      - qdrant
    profiles:
      - ingest

  # API service
  api:
    build: .
    container_name: rag-api
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - CONFIG_PATH=/app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml
    networks:
      - rag-network
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_storage:

networks:
  rag-network:
    driver: bridge
